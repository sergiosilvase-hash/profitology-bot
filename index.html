<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profitology Bot - Smart Signals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f17; color: #ffffff; margin: 0; padding: 0; }
        .glow-green { box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 md:p-4">

<div id="root" class="w-full max-w-md"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    const BROKERS = [
        { id: 'hezilex', name: 'Hezilex', icon: '🚀' },
        { id: 'quotex', name: 'Quotex', icon: '💎' },
        { id: 'deriv', name: 'Deriv', icon: '⚡' },
        { id: 'pocket', name: 'Pocket Option', icon: '🪐' },
        { id: 'iqoption', name: 'IQ Option', icon: '🎯' }
    ];

    // Ativos monitorados pelo Radar com alta favorabilidade técnica
    const FAVORABLE_ASSETS = [
        { name: "Bitcoin (BTC)", symbol: "BINANCE:BTCUSDT", payout: "82%", trend: "ALTA FORTE", rec: "COMPRAR (CALL)", color: "text-emerald-400" },
        { name: "Ethereum (ETH)", symbol: "BINANCE:ETHUSDT", payout: "82%", trend: "ALTA", rec: "COMPRAR (CALL)", color: "text-emerald-400" },
        { name: "Cardano (ADA)", symbol: "BINANCE:ADAUSDT", payout: "87%", trend: "QUEDA FORTE", rec: "VENDER (PUT)", color: "text-rose-400" },
        { name: "BNB", symbol: "BINANCE:BNBUSDT", payout: "87%", trend: "LATERALIZADO", rec: "COMPRAR (CALL)", color: "text-emerald-400" },
        { name: "EUR/USD OTC", symbol: "FX:EURUSD", payout: "95%", trend: "TENDÊNCIA DE BAIXA", rec: "VENDER (PUT)", color: "text-rose-400" }
    ];

    function App() {
        const [tab, setTab] = useState('dashboard'); // 'dashboard', 'sinais', 'treinamento', 'perfil'
        const [step, setStep] = useState(0); // 0: Tela de radar/escolha, 5: Tela do sinal
        const [selectedBroker, setSelectedBroker] = useState(BROKERS[0]);
        const [selectedPair, setSelectedPair] = useState(FAVORABLE_ASSETS[0]);
        const [selectedTimeframe, setSelectedTimeframe] = useState('1'); 
        const [signalData, setSignalData] = useState(null);
        const [secondsLeft, setSecondsLeft] = useState(59);
        
        // Placar Geral de Performance
        const [stats, setStats] = useState({
            day: { wins: 0, losses: 0 },
            week: { wins: 0, losses: 0 },
            month: { wins: 0, losses: 0 }
        });

        // Inicializar o TradingView ao entrar no Passo 5
        useEffect(() => {
            if (step === 5 && tab === 'sinais') {
                const containerId = "tradingview_widget_container";
                const container = document.getElementById(containerId);
                if (container) {
                    container.innerHTML = "";
                    const script = document.createElement("script");
                    script.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
                    script.type = "text/javascript";
                    script.async = true;
                    script.innerHTML = JSON.stringify({
                        "width": "100%",
                        "height": "210",
                        "symbol": selectedPair.symbol || "BINANCE:BTCUSDT",
                        "interval": selectedTimeframe,
                        "timezone": "America/Sao_Paulo",
                        "theme": "dark",
                        "style": "1",
                        "locale": "br",
                        "hide_top_toolbar": false
                    });
                    container.appendChild(script);
                }
            }
        }, [step, selectedPair, selectedTimeframe, tab]);

        // Contagem regressiva da vela
        useEffect(() => {
            let timer;
            if (step === 5 && secondsLeft > 0 && tab === 'sinais') {
                timer = setInterval(() => setSecondsLeft(prev => prev - 1), 1000);
            } else if (secondsLeft === 0 && step === 5 && tab === 'sinais') {
                setSecondsLeft(selectedTimeframe === '1' ? 60 : 300);
            }
            return () => clearInterval(timer);
        }, [step, secondsLeft, selectedTimeframe, tab]);

        const formatTime = (totalSeconds) => {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `0${mins}:${secs < 10 ? '0' : ''}${secs}`;
        };

        // Função mágica: Clica no ativo favorável e já vai direto para o sinal configurado
        const selectFavorableAsset = (asset) => {
            setSelectedPair(asset);
            const isBuy = asset.rec.includes("COMPRAR");
            setSignalData({
                text: asset.rec,
                textColor: isBuy ? 'text-emerald-400' : 'text-rose-400',
                accuracy: (Math.random() * 2 + 96).toFixed(0) + '%'
            });
            setSecondsLeft(60);
            setStep(5); // Vai direto para a tela de gráfico e sinal
        };

        const updateScore = (period, type, delta) => {
            setStats(prev => ({
                ...prev,
                [period]: {
                    ...prev[period],
                    [type]: Math.max(0, prev[period][type] + delta)
                }
            }));
        };

        const calcRate = (w, l) => {
            const total = w + l;
            if (total === 0) return "0%";
            return ((w / total) * 100).toFixed(0) + "%";
        };

        return (
            <div className="bg-[#0b0f17] rounded-2xl border border-slate-800 shadow-2xl overflow-hidden w-full max-w-md min-h-[720px] flex flex-col justify-between relative">
                
                {/* Header Superior */}
                <div className="bg-[#121824] p-3 flex justify-between items-center border-b border-slate-800">
                    <div className="flex items-center space-x-2">
                        <div className="w-5 h-5 bg-emerald-500 rounded flex items-center justify-center font-bold text-black text-xs">▲</div>
                        <span className="font-extrabold text-base text-white tracking-wider">PROFITOLOGY</span>
                    </div>
                    <div className="flex items-center space-x-2">
                        <span className="bg-slate-800 text-xs text-emerald-400 px-2.5 py-1 rounded-lg font-bold border border-slate-700 flex items-center gap-1">
                            {selectedBroker.icon} {selectedBroker.name}
                        </span>
                        <span className="bg-slate-800 text-xs text-slate-300 px-2.5 py-1 rounded-lg font-semibold border border-slate-700">🇧🇷 PT</span>
                    </div>
                </div>

                {/* Conteúdo Principal */}
                <div className="p-3 flex-1 overflow-y-auto">

                    {/* DASHBOARD PRINCIPAL */}
                    {tab === 'dashboard' && (
                        <div className="space-y-4">
                            <div>
                                <h2 className="text-lg font-extrabold text-white">Dashboard Geral de Performance</h2>
                                <p className="text-xs text-slate-400">Acompanhamento consolidado de Win e Loss por período.</p>
                            </div>

                            <div className="bg-[#141b2d] p-4 rounded-xl border border-slate-800 space-y-3">
                                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Resultado de Hoje</span>
                                <div className="grid grid-cols-3 gap-2 text-center">
                                    <div className="bg-emerald-950/40 border border-emerald-500/30 p-2.5 rounded-xl">
                                        <span className="text-[10px] text-emerald-400 font-bold block uppercase">WIN</span>
                                        <span className="text-xl font-extrabold text-emerald-400">{stats.day.wins}</span>
                                    </div>
                                    <div className="bg-rose-950/40 border border-rose-500/30 p-2.5 rounded-xl">
                                        <span className="text-[10px] text-rose-400 font-bold block uppercase">LOSS</span>
                                        <span className="text-xl font-extrabold text-rose-400">{stats.day.losses}</span>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-2.5 rounded-xl">
                                        <span className="text-[10px] text-cyan-400 font-bold block uppercase">Assertividade</span>
                                        <span className="text-xl font-extrabold text-cyan-400">{calcRate(stats.day.wins, stats.day.losses)}</span>
                                    </div>
                                </div>
                            </div>

                            {/* Gerenciador de Placar Manual */}
                            <div className="bg-[#141b2d] p-3.5 rounded-xl border border-slate-800 space-y-3">
                                <span className="text-xs font-bold text-slate-300 block border-b border-slate-800 pb-2">Editar Placar por Linha do Tempo</span>

                                {['day', 'week', 'month'].map((period) => {
                                    const title = period === 'day' ? 'Hoje' : period === 'week' ? 'Esta Semana' : 'Este Mês';
                                    return (
                                        <div key={period} className="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
                                            <div>
                                                <span className="text-xs font-bold text-white block">{title}</span>
                                                <span className="text-[10px] text-slate-400">{stats[period].wins}W • {stats[period].losses}L</span>
                                            </div>
                                            <div className="flex space-x-1">
                                                <button onClick={() => updateScore(period, 'wins', 1)} className="bg-emerald-600 px-2 py-1 rounded text-xs font-bold text-white">+ Win</button>
                                                <button onClick={() => updateScore(period, 'wins', -1)} className="bg-slate-800 px-2 py-1 rounded text-xs text-slate-400">-</button>
                                                <button onClick={() => updateScore(period, 'losses', 1)} className="bg-rose-600 px-2 py-1 rounded text-xs font-bold text-white">+ Loss</button>
                                                <button onClick={() => updateScore(period, 'losses', -1)} className="bg-slate-800 px-2 py-1 rounded text-xs text-slate-400">-</button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* ABA SINAIS: COM RADAR DE ATIVOS FAVORÁVEIS */}
                    {tab === 'sinais' && (
                        <div>
                            {/* PASSO 0: Radar Inteligente de Ativos Favoráveis */}
                            {step === 0 && (
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <h2 className="text-base font-extrabold text-white">🚀 Radar de Ativos Favoráveis</h2>
                                            <p className="text-[11px] text-slate-400">Clique em um ativo para gerar o sinal imediatamente:</p>
                                        </div>
                                    </div>

                                    {/* Seletor de Corretora */}
                                    <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
                                        {BROKERS.map(b => (
                                            <button 
                                                key={b.id} 
                                                onClick={() => setSelectedBroker(b)}
                                                className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition-all flex items-center gap-1 whitespace-nowrap ${selectedBroker.id === b.id ? 'bg-emerald-500 text-black border-emerald-400' : 'bg-[#182030] text-slate-300 border-slate-700'}`}
                                            >
                                                <span>{b.icon}</span> {b.name}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Lista de Oportunidades Favoráveis (1 Clique leva ao sinal) */}
                                    <div className="space-y-2 pt-1">
                                        {FAVORABLE_ASSETS.map((asset, idx) => (
                                            <div 
                                                key={idx}
                                                onClick={() => selectFavorableAsset(asset)}
                                                className="bg-[#141b2d] hover:border-emerald-500 border border-slate-800 p-3 rounded-xl cursor-pointer transition-all flex justify-between items-center group"
                                            >
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-extrabold text-xs text-white group-hover:text-emerald-400">{asset.name}</span>
                                                        <span className="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded font-extrabold">{asset.payout}</span>
                                                    </div>
                                                    <span className="text-[10px] text-slate-400 block mt-0.5">Análise: <span className="text-slate-200 font-semibold">{asset.trend}</span></span>
                                                </div>
                                                <div className="text-right flex items-center gap-2">
                                                    <div>
                                                        <span className="text-[9px] text-slate-400 block">SINAL SUGERIDO</span>
                                                        <span className={`text-xs font-extrabold ${asset.color}`}>{asset.rec}</span>
                                                    </div>
                                                    <span className="bg-slate-800 text-slate-300 px-2 py-1 rounded-lg text-xs">▶</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* PASSO 5: Tela do Sinal e Gráfico em Tempo Real (Fiel à Referência)[span_1](start_span)[span_1](end_span) */}
                            {step === 5 && signalData && (
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <span className="text-xs text-slate-300 font-bold block">{selectedPair?.name} • {selectedTimeframe} MIN</span>
                                            <span className="text-[9px] text-emerald-400 font-semibold">🟢 Sinais Validados via IA TradingView</span>
                                        </div>
                                        <button onClick={() => setStep(0)} className="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300 border border-slate-700 font-medium">Trocar Ativo</button>
                                    </div>
                                    
                                    {/* Gráfico do TradingView */}
                                    <div className="rounded-xl overflow-hidden border border-slate-800 bg-[#121824] h-[210px]">
                                        <div id="tradingview_widget_container" className="w-full h-full"></div>
                                    </div>
                                    
                                    {/* Timer de Fechamento da Vela[span_2](start_span)[span_2](end_span) */}
                                    <div className="bg-[#141b2d] px-3.5 py-2.5 rounded-xl border border-slate-800 flex justify-between items-center">
                                        <span className="text-xs text-slate-300 font-medium">Fechamento da Vela atual:</span>
                                        <span className="text-sm font-mono font-bold text-cyan-400">{formatTime(secondsLeft)}</span>
                                    </div>
                                    
                                    {/* Recomendação do Bot e Assertividade[span_3](start_span)[span_3](end_span) */}
                                    <div className="bg-[#141b2d] p-3.5 rounded-xl border border-slate-800 flex justify-between items-center">
                                        <div>
                                            <span className="text-[10px] text-slate-400 block font-bold uppercase tracking-wider">RECOMENDAÇÃO BOT</span>
                                            <span className={`text-sm font-extrabold ${signalData.textColor}`}>{signalData.text}</span>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-[10px] text-slate-400 block font-bold uppercase tracking-wider">ASSERTIVIDADE</span>
                                            <span className="text-sm font-extrabold text-emerald-400">{signalData.accuracy}</span>
                                        </div>
                                    </div>

                                    {/* Botões de Ação Comprar e Vender[span_4](start_span)[span_4](end_span) */}
                                    <div className="grid grid-cols-2 gap-3 pt-1">
                                        <button onClick={() => alert("Ordem de Compra (Call) registrada com sucesso!")} className="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3 rounded-xl text-sm shadow-lg shadow-emerald-950/50 transition-all flex items-center justify-center gap-1">
                                            Comprar ▲
                                        </button>
                                        <button onClick={() => alert("Ordem de Venda (Put) registrada com sucesso!")} className="bg-rose-600 hover:bg-rose-500 text-white font-extrabold py-3 rounded-xl text-sm shadow-lg shadow-rose-950/50 transition-all flex items-center justify-center gap-1">
                                            Vender ▼
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* TREINAMENTO */}
                    {tab === 'treinamento' && (
                        <div className="space-y-3 text-xs">
                            <h2 className="text-lg font-extrabold text-white">📖 Manual de Treinamento</h2>
                            <div className="bg-[#182030] p-3 rounded-xl border border-slate-800 space-y-1">
                                <h3 className="font-bold text-emerald-400 text-sm">Radar de Ativos Favoráveis</h3>
                                <p className="text-slate-300">Na aba Sinais, o sistema filtra automaticamente os ativos com maior probabilidade técnica no momento. Clique em qualquer um deles para abrir o gráfico e operar instantaneamente.</p>
                            </div>
                        </div>
                    )}

                    {/* PERFIL */}
                    {tab === 'perfil' && (
                        <div className="space-y-3">
                            <h2 className="text-lg font-extrabold text-white">Perfil do Trader</h2>
                            <div className="bg-[#182030] p-3.5 rounded-xl border border-slate-800 text-xs space-y-2">
                                <div className="flex justify-between"><span className="text-slate-400">Status:</span><span className="text-emerald-400 font-bold">VIP PRO</span></div>
                                <div className="flex justify-between"><span className="text-slate-400">Corretora Atual:</span><span className="text-white font-bold">{selectedBroker.name}</span></div>
                            </div>
                        </div>
                    )}
                </div>

                {/* NAVEGAÇÃO INFERIOR[span_5](start_span)[span_5](end_span) */}
                <div className="bg-[#121824] border-t border-slate-800 p-2 grid grid-cols-4 gap-1 text-center">
                    <button onClick={() => setTab('dashboard')} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 ${tab === 'dashboard' ? 'bg-slate-800 text-emerald-400 border border-slate-700' : 'text-slate-500'}`}>
                        <span>📊</span>
                        <span className="text-[10px]">Dashboard</span>
                    </button>
                    <button onClick={() => { setTab('sinais'); setStep(0); }} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 ${tab === 'sinais' ? 'bg-emerald-500 text-black font-extrabold glow-green' : 'text-slate-500'}`}>
                        <span>📈</span>
                        <span className="text-[10px]">Sinais</span>
                    </button>
                    <button onClick={() => setTab('treinamento')} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 ${tab === 'treinamento' ? 'bg-slate-800 text-white border border-slate-700' : 'text-slate-500'}`}>
                        <span>📖</span>
                        <span className="text-[10px]">Treino</span>
                    </button>
                    <button onClick={() => setTab('perfil')} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 ${tab === 'perfil' ? 'bg-slate-800 text-white border border-slate-700' : 'text-slate-500'}`}>
                        <span>👤</span>
                        <span className="text-[10px]">Perfil</span>
                    </button>
                </div>

            </div>
        );
    }
    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
