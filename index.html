<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profitology Bot - Dashboard & Signals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f17; color: #ffffff; margin: 0; padding: 0; }
        .glow-green { box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 md:p-4">

<div id="root" class="w-full max-w-md"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    const BROKERS = [
        { id: 'hezilex', name: 'Hezilex', icon: '🚀' },
        { id: 'quotex', name: 'Quotex', icon: '💎' },
        { id: 'deriv', name: 'Deriv', icon: '⚡' },
        { id: 'pocket', name: 'Pocket Option', icon: '🪐' },
        { id: 'iqoption', name: 'IQ Option', icon: '🎯' }
    ];

    const MARKETS = {
        HEZILEX_ATIVOS: [
            { name: "Bitcoin", symbol: "BINANCE:BTCUSDT", payout: "82%" },
            { name: "Litecoin", symbol: "BINANCE:LTCUSDT", payout: "82%" },
            { name: "Cardano", symbol: "BINANCE:ADAUSDT", payout: "87%" },
            { name: "BNB", symbol: "BINANCE:BNBUSDT", payout: "87%" },
            { name: "XRP", symbol: "BINANCE:XRPUSDT", payout: "82%" },
            { name: "Ethereum", symbol: "BINANCE:ETHUSDT", payout: "82%" },
            { name: "Solana", symbol: "BINANCE:SOLUSDT", payout: "82%" },
            { name: "AVAX", symbol: "BINANCE:AVAXUSDT", payout: "80%" },
            { name: "DOGE", symbol: "BINANCE:DOGEUSDT", payout: "82%" },
            { name: "SUI", symbol: "BINANCE:SUIUSDT", payout: "80%" },
            { name: "XPL", symbol: "BINANCE:BTCUSDT", payout: "80%" },
            { name: "Stellar", symbol: "BINANCE:XLMUSDT", payout: "80%" }
        ],
        OTC: [
            { name: "EUR/USD OTC", symbol: "FX:EURUSD", payout: "95%" },
            { name: "EUR/GBP OTC", symbol: "FX:EURGBP", payout: "91%" },
            { name: "GBP/USD OTC", symbol: "FX:GBPUSD", payout: "89%" }
        ]
    };

    function App() {
        const [tab, setTab] = useState('dashboard'); // 'dashboard', 'sinais', 'treinamento', 'perfil'
        const [step, setStep] = useState(0); 
        const [selectedBroker, setSelectedBroker] = useState(BROKERS[0]);
        const [selectedMarket, setSelectedMarket] = useState('HEZILEX_ATIVOS');
        const [selectedPair, setSelectedPair] = useState(MARKETS.HEZILEX_ATIVOS[0]);
        const [selectedTimeframe, setSelectedTimeframe] = useState('1'); 
        const [signalData, setSignalData] = useState(null);
        const [secondsLeft, setSecondsLeft] = useState(15);
        
        // Dados do Dashboard de Placar Geral
        const [stats, setStats] = useState({
            day: { wins: 0, losses: 0 },
            week: { wins: 0, losses: 0 },
            month: { wins: 0, losses: 0 }
        });

        useEffect(() => {
            if (step === 5 && tab === 'sinais') {
                const containerId = "tradingview_widget_container";
                const container = document.getElementById(containerId);
                if (container) {
                    container.innerHTML = "";
                    const script = document.createElement("script");
                    script.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
                    script.type = "text/javascript";
                    script.async = true;
                    script.innerHTML = JSON.stringify({
                        "width": "100%",
                        "height": "220",
                        "symbol": selectedPair.symbol || "BINANCE:BTCUSDT",
                        "interval": selectedTimeframe,
                        "timezone": "America/Sao_Paulo",
                        "theme": "dark",
                        "style": "1",
                        "locale": "br",
                        "hide_top_toolbar": false
                    });
                    container.appendChild(script);
                }
            }
        }, [step, selectedPair, selectedTimeframe, tab]);

        useEffect(() => {
            let timer;
            if (step === 5 && secondsLeft > 0 && tab === 'sinais') {
                timer = setInterval(() => setSecondsLeft(prev => prev - 1), 1000);
            } else if (secondsLeft === 0 && step === 5 && tab === 'sinais') {
                setSecondsLeft(selectedTimeframe === '1' ? 60 : 300);
            }
            return () => clearInterval(timer);
        }, [step, secondsLeft, selectedTimeframe, tab]);

        const formatTime = (totalSeconds) => {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `0${mins}:${secs < 10 ? '0' : ''}${secs}`;
        };

        const generateSignal = (tfVal) => {
            setSelectedTimeframe(tfVal);
            setSecondsLeft(tfVal === '1' ? 60 : 300);
            setStep(4);
            setTimeout(() => {
                const isBuy = Math.random() > 0.45;
                setSignalData({
                    text: isBuy ? 'COMPRAR (CALL)' : 'VENDER (PUT)',
                    textColor: isBuy ? 'text-emerald-400' : 'text-red-400',
                    accuracy: '98%'
                });
                setStep(5);
            }, 1200);
        };

        const updateScore = (period, type, delta) => {
            setStats(prev => ({
                ...prev,
                [period]: {
                    ...prev[period],
                    [type]: Math.max(0, prev[period][type] + delta)
                }
            }));
        };

        const calcRate = (w, l) => {
            const total = w + l;
            if (total === 0) return "0%";
            return ((w / total) * 100).toFixed(0) + "%";
        };

        return (
            <div className="bg-[#0b0f17] rounded-2xl border border-slate-800 shadow-2xl overflow-hidden w-full max-w-md min-h-[720px] flex flex-col justify-between relative">
                
                {/* Header Superior */}
                <div className="bg-[#121824] p-3 flex justify-between items-center border-b border-slate-800">
                    <div className="flex items-center space-x-2">
                        <div className="w-5 h-5 bg-emerald-500 rounded flex items-center justify-center font-bold text-black text-xs">▲</div>
                        <span className="font-extrabold text-base text-white tracking-wider">PROFITOLOGY</span>
                    </div>
                    <div className="flex items-center space-x-2">
                        <span className="bg-slate-800 text-xs text-emerald-400 px-2.5 py-1 rounded-lg font-bold border border-slate-700 flex items-center gap-1">
                            {selectedBroker.icon} {selectedBroker.name}
                        </span>
                        <span className="bg-slate-800 text-xs text-slate-300 px-2.5 py-1 rounded-lg font-semibold border border-slate-700">🇧🇷 PT</span>
                    </div>
                </div>

                {/* Conteúdo Principal */}
                <div className="p-3 flex-1 overflow-y-auto">

                    {/* TELA 1: DASHBOARD PRINCIPAL DE WIN / LOSS */}
                    {tab === 'dashboard' && (
                        <div className="space-y-4">
                            <div>
                                <h2 className="text-lg font-extrabold text-white">Dashboard Geral de Performance</h2>
                                <p className="text-xs text-slate-400">Acompanhamento consolidado de Win e Loss por período.</p>
                            </div>

                            {/* Resumo Consolidado do Dia */}
                            <div className="bg-[#141b2d] p-4 rounded-xl border border-slate-800 space-y-3">
                                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Resultado de Hoje</span>
                                <div className="grid grid-cols-3 gap-2 text-center">
                                    <div className="bg-emerald-950/40 border border-emerald-500/30 p-2.5 rounded-xl">
                                        <span className="text-[10px] text-emerald-400 font-bold block uppercase">Vitórias (WIN)</span>
                                        <span className="text-xl font-extrabold text-emerald-400">{stats.day.wins}</span>
                                    </div>
                                    <div className="bg-rose-950/40 border border-rose-500/30 p-2.5 rounded-xl">
                                        <span className="text-[10px] text-rose-400 font-bold block uppercase">Derrotas (LOSS)</span>
                                        <span className="text-xl font-extrabold text-rose-400">{stats.day.losses}</span>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-2.5 rounded-xl">
                                        <span className="text-[10px] text-cyan-400 font-bold block uppercase">Assertividade</span>
                                        <span className="text-xl font-extrabold text-cyan-400">{calcRate(stats.day.wins, stats.day.losses)}</span>
                                    </div>
                                </div>
                            </div>

                            {/* Controle Manual e Linha do Tempo */}
                            <div className="bg-[#141b2d] p-3.5 rounded-xl border border-slate-800 space-y-3">
                                <span className="text-xs font-bold text-slate-300 block border-b border-slate-800 pb-2">Gerenciar Placar por Período</span>

                                {/* HOJE */}
                                <div className="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
                                    <div>
                                        <span className="text-xs font-bold text-white block">Hoje</span>
                                        <span className="text-[10px] text-slate-400">{stats.day.wins} Wins • {stats.day.losses} Losses</span>
                                    </div>
                                    <div className="flex space-x-1">
                                        <button onClick={() => updateScore('day', 'wins', 1)} className="bg-emerald-600 px-2 py-1 rounded text-xs font-bold text-white">+ Win</button>
                                        <button onClick={() => updateScore('day', 'wins', -1)} className="bg-slate-800 px-2 py-1 rounded text-xs text-slate-400">-</button>
                                        <button onClick={() => updateScore('day', 'losses', 1)} className="bg-rose-600 px-2 py-1 rounded text-xs font-bold text-white">+ Loss</button>
                                        <button onClick={() => updateScore('day', 'losses', -1)} className="bg-slate-800 px-2 py-1 rounded text-xs text-slate-400">-</button>
                                    </div>
                                </div>

                                {/* SEMANA */}
                                <div className="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
                                    <div>
                                        <span className="text-xs font-bold text-white block">Esta Semana</span>
                                        <span className="text-[10px] text-slate-400">{stats.week.wins} Wins • {stats.week.losses} Losses</span>
                                    </div>
                                    <div className="flex space-x-1">
                                        <button onClick={() => updateScore('week', 'wins', 1)} className="bg-emerald-600 px-2 py-1 rounded text-xs font-bold text-white">+ Win</button>
                                        <button onClick={() => updateScore('week', 'wins', -1)} className="bg-slate-800 px-2 py-1 rounded text-xs text-slate-400">-</button>
                                        <button onClick={() => updateScore('week', 'losses', 1)} className="bg-rose-600 px-2 py-1 rounded text-xs font-bold text-white">+ Loss</button>
                                        <button onClick={() => updateScore('week', 'losses', -1)} className="bg-slate-800 px-2 py-1 rounded text-xs text-slate-400">-</button>
                                    </div>
                                </div>

                                {/* MÊS */}
                                <div className="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
                                    <div>
                                        <span className="text-xs font-bold text-white block">Este Mês</span>
                                        <span className="text-[10px] text-slate-400">{stats.month.wins} Wins • {stats.month.losses} Losses</span>
                                    </div>
                                    <div className="flex space-x-1">
                                        <button onClick={() => updateScore('month', 'wins', 1)} className="bg-emerald-600 px-2 py-1 rounded text-xs font-bold text-white">+ Win</button>
                                        <button onClick={() => updateScore('month', 'wins', -1)} className="bg-slate-800 px-2 py-1 rounded text-xs text-slate-400">-</button>
                                        <button onClick={() => updateScore('month', 'losses', 1)} className="bg-rose-600 px-2 py-1 rounded text-xs font-bold text-white">+ Loss</button>
                                        <button onClick={() => updateScore('month', 'losses', -1)} className="bg-slate-800 px-2 py-1 rounded text-xs text-slate-400">-</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TELA 2: SINAIS DE TRADING (LAYOUT FIEL À FOTO DE REFERÊNCIA) */}
                    {tab === 'sinais' && (
                        <div>
                            {step === 0 && (
                                <div>
                                    <h2 className="text-base font-extrabold text-white mb-2">Escolha a Corretora</h2>
                                    <div className="grid grid-cols-2 gap-2">
                                        {BROKERS.map(b => (
                                            <div key={b.id} onClick={() => { setSelectedBroker(b); setStep(1); }} className="bg-[#182030] p-3 rounded-xl border border-slate-700 text-center cursor-pointer">
                                                <span className="text-xl">{b.icon}</span>
                                                <span className="block font-bold text-xs mt-1 text-white">{b.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step === 1 && (
                                <div>
                                    <div className="flex justify-between mb-2"><h2 className="text-base font-extrabold text-white">Mercado</h2><button onClick={() => setStep(0)} className="text-xs bg-slate-800 px-2 py-1 rounded">Voltar</button></div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div onClick={() => { setSelectedMarket('HEZILEX_ATIVOS'); setStep(2); }} className="bg-[#182030] p-3 rounded-xl border border-slate-700 cursor-pointer">
                                            <h3 className="font-bold text-sm text-white">Hezilex Ativos</h3>
                                        </div>
                                        <div onClick={() => { setSelectedMarket('OTC'); setStep(2); }} className="bg-[#182030] p-3 rounded-xl border border-slate-700 cursor-pointer">
                                            <h3 className="font-bold text-sm text-white">Mercado OTC</h3>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 2 && (
                                <div>
                                    <div className="flex justify-between mb-2"><h2 className="text-base font-extrabold text-white">Ativo</h2><button onClick={() => setStep(1)} className="text-xs bg-slate-800 px-2 py-1 rounded">Voltar</button></div>
                                    <div className="grid grid-cols-2 gap-2 max-h-[280px] overflow-y-auto">
                                        {(MARKETS[selectedMarket] || []).map((p, i) => (
                                            <div key={i} onClick={() => { setSelectedPair(p); setStep(3); }} className="bg-[#182030] p-2.5 rounded-xl border border-slate-800 cursor-pointer flex justify-between items-center">
                                                <span className="text-xs font-bold text-white">{p.name}</span>
                                                <span className="text-[10px] text-emerald-400">{p.payout}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step === 3 && (
                                <div>
                                    <div className="flex justify-between mb-2"><h2 className="text-base font-extrabold text-white">Expiração</h2><button onClick={() => setStep(2)} className="text-xs bg-slate-800 px-2 py-1 rounded">Voltar</button></div>
                                    <div className="grid grid-cols-2 gap-2">
                                        {['1', '5'].map(tf => (
                                            <button key={tf} onClick={() => generateSignal(tf)} className="bg-[#182030] p-4 rounded-xl border border-slate-700 text-center font-bold text-emerald-400">
                                                {tf} MINUTO{tf > '1' ? 'S' : ''}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="flex flex-col items-center justify-center py-16 text-center">
                                    <div className="w-10 h-10 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin mb-3"></div>
                                    <p className="text-xs text-slate-400">Analisando Mercado...</p>
                                </div>
                            )}

                            {step === 5 && signalData && (
                                <div className="space-y-3">
                                    {/* Topo do Ativo e Seleção */}
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs text-slate-300 font-bold">{selectedPair?.name} • {selectedTimeframe} MIN</span>
                                        <button onClick={() => setStep(2)} className="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300 border border-slate-700 font-medium">Trocar Ativo</button>
                                    </div>
                                    
                                    {/* Gráfico do TradingView */}
                                    <div className="rounded-xl overflow-hidden border border-slate-800 bg-[#121824] h-[220px]">
                                        <div id="tradingview_widget_container" className="w-full h-full"></div>
                                    </div>
                                    
                                    {/* Timer do Fechamento da Vela */}
                                    <div className="bg-[#141b2d] px-3.5 py-2.5 rounded-xl border border-slate-800 flex justify-between items-center">
                                        <span className="text-xs text-slate-300 font-medium">Fechamento da Vela atual:</span>
                                        <span className="text-sm font-mono font-bold text-cyan-400">{formatTime(secondsLeft)}</span>
                                    </div>
                                    
                                    {/* Recomendação do Bot */}
                                    {signalData && (
                                        <div className="bg-[#141b2d] p-3.5 rounded-xl border border-slate-800 flex justify-between items-center">
                                            <div>
                                                <span className="text-[10px] text-slate-400 block font-bold uppercase tracking-wider">RECOMENDAÇÃO BOT</span>
                                                <span className={`text-sm font-extrabold ${signalData.textColor}`}>{signalData.text}</span>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-[10px] text-slate-400 block font-bold uppercase tracking-wider">ASSERTIVIDADE</span>
                                                <span className="text-sm font-extrabold text-emerald-400">{signalData.accuracy}</span>
                                            </div>
                                        </div>
                                    )}

                                    {/* Botões de Ação Comprar e Vender */}
                                    <div className="grid grid-cols-2 gap-3 pt-1">
                                        <button onClick={() => alert("Ordem de Compra (Call) registrada!")} className="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3 rounded-xl text-sm shadow-lg shadow-emerald-950/50 transition-all flex items-center justify-center gap-1">
                                            Comprar ▲
                                        </button>
                                        <button onClick={() => alert("Ordem de Venda (Put) registrada!")} className="bg-rose-600 hover:bg-rose-500 text-white font-extrabold py-3 rounded-xl text-sm shadow-lg shadow-rose-950/50 transition-all flex items-center justify-center gap-1">
                                            Vender ▼
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* TELA 3: TREINAMENTO */}
                    {tab === 'treinamento' && (
                        <div className="space-y-3 text-xs">
                            <h2 className="text-lg font-extrabold text-white">📖 Manual de Treinamento</h2>
                            <div className="bg-[#182030] p-3 rounded-xl border border-slate-800 space-y-1">
                                <h3 className="font-bold text-emerald-400 text-sm">1. Gerenciamento do Placar</h3>
                                <p className="text-slate-300">Acesse a aba Dashboard para visualizar o histórico de acertos e controlar o resultado total das operações diárias, semanais e mensais.</p>
                            </div>
                        </div>
                    )}

                    {/* TELA 4: PERFIL */}
                    {tab === 'perfil' && (
                        <div className="space-y-3">
                            <h2 className="text-lg font-extrabold text-white">Perfil do Trader</h2>
                            <div className="bg-[#182030] p-3.5 rounded-xl border border-slate-800 text-xs space-y-2">
                                <div className="flex justify-between"><span className="text-slate-400">Status:</span><span className="text-emerald-400 font-bold">VIP PRO</span></div>
                                <div className="flex justify-between"><span className="text-slate-400">Corretora:</span><span className="text-white font-bold">{selectedBroker.name}</span></div>
                            </div>
                        </div>
                    )}
                </div>

                {/* NAVEGAÇÃO INFERIOR */}
                <div className="bg-[#121824] border-t border-slate-800 p-2 grid grid-cols-4 gap-1 text-center">
                    <button onClick={() => setTab('dashboard')} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 ${tab === 'dashboard' ? 'bg-slate-800 text-emerald-400 border border-slate-700' : 'text-slate-500'}`}>
                        <span>📊</span>
                        <span className="text-[10px]">Dashboard</span>
                    </button>
                    <button onClick={() => { setTab('sinais'); setStep(0); }} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 ${tab === 'sinais' ? 'bg-emerald-500 text-black font-extrabold glow-green' : 'text-slate-500'}`}>
                        <span>📈</span>
                        <span className="text-[10px]">Sinais</span>
                    </button>
                    <button onClick={() => setTab('treinamento')} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 ${tab === 'treinamento' ? 'bg-slate-800 text-white border border-slate-700' : 'text-slate-500'}`}>
                        <span>📖</span>
                        <span className="text-[10px]">Treino</span>
                    </button>
                    <button onClick={() => setTab('perfil')} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 ${tab === 'perfil' ? 'bg-slate-800 text-white border border-slate-700' : 'text-slate-500'}`}>
                        <span>👤</span>
                        <span className="text-[10px]">Perfil</span>
                    </button>
                </div>

            </div>
        );
    }
    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
