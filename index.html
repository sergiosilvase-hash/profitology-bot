<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profitology Bot - Live Real-Time</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f17; color: #ffffff; }
        .glow-green { box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 md:p-4">

<div id="root" class="w-full max-w-md"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    const BROKERS = [
        { id: 'quotex', name: 'Quotex', icon: '💎' },
        { id: 'deriv', name: 'Deriv', icon: '⚡' },
        { id: 'pocket', name: 'Pocket Option', icon: '🚀' },
        { id: 'iqoption', name: 'IQ Option', icon: '🎯' }
    ];

    const MARKETS = {
        OTC: [
            { name: "EUR/USD OTC", symbol: "FX:EURUSD", payout: "95%" },
            { name: "EUR/GBP OTC", symbol: "FX:EURGBP", payout: "91%" },
            { name: "GBP/USD OTC", symbol: "FX:GBPUSD", payout: "89%" },
            { name: "USD/JPY OTC", symbol: "FX:USDJPY", payout: "91%" },
            { name: "USD/CHF OTC", symbol: "FX:USDCHF", payout: "89%" },
            { name: "AUD/USD OTC", symbol: "FX:AUDUSD", payout: "74%" }
        ],
        FOREX: [
            { name: "EUR/USD", symbol: "FX:EURUSD", payout: "82%" },
            { name: "GBP/USD", symbol: "FX:GBPUSD", payout: "80%" },
            { name: "EUR/GBP", symbol: "FX:EURGBP", payout: "79%" }
        ],
        COMMODITIES: [
            { name: "OURO OTC", symbol: "TVC:GOLD", payout: "90%" },
            { name: "PETRÓLEO OTC", symbol: "TVC:USOIL", payout: "87%" }
        ],
        STOCKS: [
            { name: "APPLE OTC", symbol: "NASDAQ:AAPL", payout: "93%" },
            { name: "TESLA OTC", symbol: "NASDAQ:TSLA", payout: "91%" }
        ],
        CRYPTO: [
            { name: "BITCOIN OTC", symbol: "BINANCE:BTCUSDT", payout: "86%" },
            { name: "ETHEREUM OTC", symbol: "BINANCE:ETHUSDT", payout: "84%" }
        ]
    };

    function App() {
        const [step, setStep] = useState(0); 
        const [selectedBroker, setSelectedBroker] = useState(BROKERS[0]);
        const [selectedMarket, setSelectedMarket] = useState('OTC');
        const [selectedPair, setSelectedPair] = useState(MARKETS.OTC[0]);
        const [selectedTimeframe, setSelectedTimeframe] = useState('1'); 
        const [searchQuery, setSearchQuery] = useState('');
        const [signalData, setSignalData] = useState(null);
        
        const [secondsLeft, setSecondsLeft] = useState(60);
        const [tab, setTab] = useState('sinais');

        // Renderização garantida do widget avançado em tempo real do TradingView
        useEffect(() => {
            if (step === 5) {
                const containerId = "tradingview_widget_container";
                document.getElementById(containerId).innerHTML = "";
                
                const script = document.createElement("script");
                script.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
                script.type = "text/javascript";
                script.async = true;
                script.innerHTML = JSON.stringify({
                    "width": "100%",
                    "height": "290",
                    "symbol": selectedPair.symbol || "FX:EURUSD",
                    "interval": selectedTimeframe,
                    "timezone": "America/Sao_Paulo",
                    "theme": "dark",
                    "style": "1", // Velas (Candlesticks)
                    "locale": "br",
                    "allow_symbol_change": false,
                    "calendar": false,
                    "support_host": "https://www.tradingview.com"
                });
                document.getElementById(containerId).appendChild(script);
            }
        }, [step, selectedPair, selectedTimeframe]);

        // Contagem regressiva do relógio em formato brasileiro
        useEffect(() => {
            let timer;
            if (step === 5 && secondsLeft > 0) {
                timer = setInterval(() => setSecondsLeft(prev => prev - 1), 1000);
            } else if (secondsLeft === 0 && step === 5) {
                const totalSecs = selectedTimeframe === '1' ? 60 : selectedTimeframe === '3' ? 180 : selectedTimeframe === '5' ? 300 : 900;
                setSecondsLeft(totalSecs);
            }
            return () => clearInterval(timer);
        }, [step, secondsLeft, selectedTimeframe]);

        const formatTime = (totalSeconds) => {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `0${mins}:${secs < 10 ? '0' : ''}${secs}`;
        };

        const generateSignal = (tfVal) => {
            setSelectedTimeframe(tfVal);
            const totalSecs = tfVal === '1' ? 60 : tfVal === '3' ? 180 : tfVal === '5' ? 300 : 900;
            setSecondsLeft(totalSecs);
            setStep(4);

            setTimeout(() => {
                const isBuy = Math.random() > 0.45;
                setSignalData({
                    type: isBuy ? 'BUY' : 'SELL',
                    text: isBuy ? 'COMPRAR (CALL)' : 'VENDER (PUT)',
                    textColor: isBuy ? 'text-emerald-400' : 'text-red-400',
                    accuracy: (Math.random() * 3 + 95).toFixed(0) + '%'
                });
                setStep(5);
            }, 2000);
        };

        return (
            <div className="bg-[#111622] rounded-2xl border border-slate-800 shadow-2xl overflow-hidden min-h-[740px] flex flex-col justify-between relative">
                
                {/* Header Superior */}
                <div className="bg-[#161c2e] p-3 flex justify-between items-center border-b border-slate-800">
                    <div className="flex items-center space-x-2">
                        <div className="w-5 h-5 bg-emerald-500 rounded flex items-center justify-center font-bold text-black text-xs">▲</div>
                        <span className="font-extrabold text-base text-white tracking-wider">PROFITOLOGY</span>
                    </div>
                    <div className="flex items-center space-x-2">
                        <span className="bg-slate-800 text-xs text-emerald-400 px-2.5 py-1 rounded-lg font-bold border border-slate-700 flex items-center gap-1">
                            {selectedBroker.icon} {selectedBroker.name}
                        </span>
                        <span className="bg-slate-800 text-xs text-slate-300 px-2.5 py-1 rounded-lg font-semibold border border-slate-700">🇧🇷 PT</span>
                    </div>
                </div>

                {/* Conteúdo Dinâmico */}
                <div className="p-3 flex-1 overflow-y-auto">

                    {/* PASSO 0: Corretora */}
                    {step === 0 && (
                        <div>
                            <h2 className="text-lg font-extrabold text-white mb-1">Escolha a Corretora</h2>
                            <p className="text-xs text-slate-400 mb-3">Selecione onde opera seus sinais.</p>
                            <div className="grid grid-cols-2 gap-2.5">
                                {BROKERS.map((b) => (
                                    <div 
                                        key={b.id} 
                                        onClick={() => { setSelectedBroker(b); setStep(1); }}
                                        className="bg-[#182030] border border-slate-700 hover:border-emerald-500 p-3.5 rounded-xl text-center cursor-pointer transition-all flex flex-col items-center justify-center space-y-1.5 h-24"
                                    >
                                        <span className="text-2xl">{b.icon}</span>
                                        <span className="font-bold text-xs text-white">{b.name}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* PASSO 1: Mercado */}
                    {step === 1 && (
                        <div>
                            <div className="flex justify-between items-center mb-3">
                                <h2 className="text-lg font-extrabold text-white">Escolha o Mercado</h2>
                                <button onClick={() => setStep(0)} className="bg-slate-800 text-xs px-2.5 py-1 rounded-lg text-slate-300 border border-slate-700">Voltar</button>
                            </div>
                            <div className="grid grid-cols-2 gap-2.5">
                                {Object.keys(MARKETS).map((m) => (
                                    <div 
                                        key={m} 
                                        onClick={() => { setSelectedMarket(m); setStep(2); }}
                                        className="bg-[#182030] border border-slate-700 hover:border-emerald-500 p-3.5 rounded-xl cursor-pointer transition-all"
                                    >
                                        <span className="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded font-bold">Ativo</span>
                                        <h3 className="font-bold text-base text-white mt-1.5">{m}</h3>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* PASSO 2: Ativo/Par */}
                    {step === 2 && (
                        <div>
                            <div className="flex justify-between items-center mb-2">
                                <div>
                                    <span className="text-[10px] text-emerald-400 font-bold uppercase">{selectedMarket}</span>
                                    <h2 className="text-lg font-extrabold text-white">Selecionar Ativo</h2>
                                </div>
                                <button onClick={() => setStep(1)} className="bg-slate-800 text-xs px-2.5 py-1 rounded-lg text-slate-300 border border-slate-700">Voltar</button>
                            </div>

                            <input 
                                type="text" 
                                placeholder="Pesquisar (ex: EUR/GBP, EUR/USD)..." 
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full bg-[#182030] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white mb-2.5 focus:outline-none focus:border-emerald-500"
                            />

                            <div className="grid grid-cols-3 gap-2 max-h-[320px] overflow-y-auto">
                                {(MARKETS[selectedMarket] || []).filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase())).map((pair, idx) => (
                                    <div 
                                        key={idx} 
                                        onClick={() => { setSelectedPair(pair); setStep(3); }}
                                        className="bg-[#182030] p-2.5 rounded-xl border border-slate-800 hover:border-emerald-500 cursor-pointer text-center flex flex-col justify-between items-center h-20"
                                    >
                                        <span className="text-[11px] font-bold text-slate-200">{pair.name}</span>
                                        <span className="bg-emerald-500/20 text-emerald-400 text-[10px] font-extrabold px-1.5 py-0.5 rounded-full">
                                            {pair.payout}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* PASSO 3: Tempo */}
                    {step === 3 && (
                        <div>
                            <div className="flex justify-between items-center mb-3">
                                <div>
                                    <span className="text-[10px] text-emerald-400 font-bold uppercase">{selectedPair?.name}</span>
                                    <h2 className="text-lg font-extrabold text-white">Tempo de Expiração</h2>
                                </div>
                                <button onClick={() => setStep(2)} className="bg-slate-800 text-xs px-2.5 py-1 rounded-lg text-slate-300 border border-slate-700">Voltar</button>
                            </div>

                            <div className="grid grid-cols-2 gap-2.5 mt-2">
                                {[
                                    { label: '1 MIN', val: '1' },
                                    { label: '3 MIN', val: '3' },
                                    { label: '5 MIN', val: '5' },
                                    { label: '15 MIN', val: '15' }
                                ].map((tf, i) => (
                                    <button 
                                        key={i} 
                                        onClick={() => generateSignal(tf.val)}
                                        className="bg-[#182030] border border-slate-700 hover:border-emerald-500 p-5 rounded-xl text-center cursor-pointer transition-all hover:scale-[1.02]"
                                    >
                                        <span className="text-2xl font-extrabold text-emerald-400 block">{tf.label.split(' ')[0]}</span>
                                        <span className="text-[10px] font-bold text-slate-400">MINUTOS</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* PASSO 4: Carregando */}
                    {step === 4 && (
                        <div className="flex flex-col items-center justify-center py-16 text-center">
                            <div className="w-20 h-20 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin mb-4 flex items-center justify-center"></div>
                            <h2 className="text-lg font-extrabold text-white mb-1">Conectando ao Feed ao Vivo</h2>
                            <p className="text-xs text-slate-400">Sincronizando gráfico de velas em tempo real...</p>
                        </div>
                    )}

                    {/* PASSO 5: Gráfico Real do TradingView em Tempo Real + Botões */}
                    {step === 5 && (
                        <div className="space-y-2.5">
                            <div className="flex justify-between items-center">
                                <span className="text-xs text-slate-300 font-bold">{selectedPair?.name} • {selectedTimeframe} MIN</span>
                                <button onClick={() => setStep(2)} className="bg-slate-800 text-xs px-2.5 py-1 rounded-lg text-slate-300 border border-slate-700 hover:bg-slate-700">Trocar Ativo</button>
                            </div>

                            {/* WIDGET AVANÇADO EM TEMPO REAL DO TRADINGVIEW */}
                            <div className="rounded-xl overflow-hidden border border-slate-800 bg-[#121824] shadow-inner">
                                <div id="tradingview_widget_container" className="w-full h-[290px]"></div>
                            </div>

                            {/* Relógio com Contagem Regressiva Brasileira */}
                            <div className="bg-[#182030] border border-slate-800 px-3 py-2 rounded-xl flex justify-between items-center">
                                <span className="text-xs text-slate-400 font-medium">Fechamento da Vela atual:</span>
                                <span className="text-sm font-mono font-extrabold text-cyan-400">
                                    {formatTime(secondsLeft)}
                                </span>
                            </div>

                            {/* Alerta de Sinal Gerado */}
                            {signalData && (
                                <div className="bg-slate-900 border border-slate-800 p-2.5 rounded-xl flex justify-between items-center">
                                    <div>
                                        <span className="text-[10px] text-slate-400 block font-bold">RECOMENDAÇÃO BOT</span>
                                        <span className={`text-sm font-extrabold ${signalData.textColor}`}>{signalData.text}</span>
                                    </div>
                                    <div className="text-right">
                                        <span className="text-[10px] text-slate-400 block font-bold">ASSERTIVIDADE</span>
                                        <span className="text-xs font-extrabold text-emerald-400">{signalData.accuracy}</span>
                                    </div>
                                </div>
                            )}

                            {/* Botões de Ação Rápida (Comprar / Vender) */}
                            <div className="grid grid-cols-2 gap-2 pt-0.5">
                                <button onClick={() => alert("Ordem de Compra (Call) enviada com sucesso!")} className="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-2.5 rounded-xl shadow-lg shadow-emerald-900/40 text-xs transition-all">
                                    Comprar ▲
                                </button>
                                <button onClick={() => alert("Ordem de Venda (Put) enviada com sucesso!")} className="bg-rose-600 hover:bg-rose-500 text-white font-extrabold py-2.5 rounded-xl shadow-lg shadow-rose-900/40 text-xs transition-all">
                                    Vender ▼
                                </button>
                            </div>
                        </div>
                    )}
                </div>

                {/* Navegação Inferior */}
                <div className="bg-[#161c2e] border-t border-slate-800 p-2 grid grid-cols-3 gap-2">
                    <button onClick={() => setTab('treinamento')} className={`py-1.5 rounded-xl flex flex-col items-center justify-center text-xs font-bold ${tab === 'treinamento' ? 'bg-slate-800 text-slate-200' : 'text-slate-500'}`}>
                        <span>📖</span>
                        <span>Treinamento</span>
                    </button>
                    <button onClick={() => { setTab('sinais'); setStep(0); }} className="bg-emerald-500 hover:bg-emerald-400 text-black py-2 rounded-xl flex flex-col items-center justify-center text-xs font-extrabold glow-green">
                        <span>📈</span>
                        <span>Sinais</span>
                    </button>
                    <button onClick={() => setTab('perfil')} className={`py-1.5 rounded-xl flex flex-col items-center justify-center text-xs font-bold ${tab === 'perfil' ? 'bg-slate-800 text-slate-200' : 'text-slate-500'}`}>
                        <span>👤</span>
                        <span>Perfil</span>
                    </button>
                </div>

            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
