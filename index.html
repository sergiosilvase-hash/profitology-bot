<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profitology Bot - Signal App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f17; color: #ffffff; margin: 0; padding: 0; }
        .glow-green { box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 md:p-4">

<div id="root" class="w-full max-w-md"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    const BROKERS = [
        { id: 'hezilex', name: 'Hezilex', icon: '🚀' },
        { id: 'quotex', name: 'Quotex', icon: '💎' },
        { id: 'deriv', name: 'Deriv', icon: '⚡' },
        { id: 'iqoption', name: 'IQ Option', icon: '🎯' }
    ];

    const MARKETS = {
        OTC: [
            { name: "USD/CHF OTC", symbol: "FX:USDCHF", payout: "95%" },
            { name: "EUR/USD OTC", symbol: "FX:EURUSD", payout: "92%" },
            { name: "EUR/GBP OTC", symbol: "FX:EURGBP", payout: "91%" },
            { name: "GBP/USD OTC", symbol: "FX:GBPUSD", payout: "89%" },
            { name: "AUD/CAD OTC", symbol: "FX:AUDCAD", payout: "85%" },
            { name: "AUD/CHF OTC", symbol: "FX:AUDCHF", payout: "81%" }
        ],
        CRYPTO: [
            { name: "Bitcoin (BTC)", symbol: "BINANCE:BTCUSDT", payout: "88%" },
            { name: "Ethereum (ETH)", symbol: "BINANCE:ETHUSDT", payout: "85%" },
            { name: "Cardano (ADA)", symbol: "BINANCE:ADAUSDT", payout: "87%" }
        ],
        STOCKS: [
            { name: "Apple (AAPL)", symbol: "NASDAQ:AAPL", payout: "90%" },
            { name: "Tesla (TSLA)", symbol: "NASDAQ:TSLA", payout: "89%" }
        ]
    };

    function App() {
        const [tab, setTab] = useState('sinais'); 
        const [step, setStep] = useState(0); 
        const [selectedBroker, setSelectedBroker] = useState(BROKERS[0]);
        const [selectedMarketType, setSelectedMarketType] = useState('OTC');
        const [selectedPair, setSelectedPair] = useState(MARKETS.OTC[0]);
        const [selectedTimeframe, setSelectedTimeframe] = useState('1'); 
        const [signalData, setSignalData] = useState(null);
        const [secondsLeft, setSecondsLeft] = useState(60);
        
        const [stats, setStats] = useState({
            day: { wins: 18, losses: 0 },
            week: { wins: 64, losses: 4 },
            month: { wins: 210, losses: 15 }
        });

        // Carregar TradingView no passo final
        useEffect(() => {
            if (step === 4 && tab === 'sinais') {
                const containerId = "tradingview_widget_container";
                const container = document.getElementById(containerId);
                if (container) {
                    container.innerHTML = "";
                    const script = document.createElement("script");
                    script.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
                    script.type = "text/javascript";
                    script.async = true;
                    script.innerHTML = JSON.stringify({
                        "width": "100%",
                        "height": "190",
                        "symbol": selectedPair.symbol || "FX:USDCHF",
                        "interval": selectedTimeframe,
                        "timezone": "America/Sao_Paulo",
                        "theme": "dark",
                        "style": "1",
                        "locale": "br",
                        "hide_top_toolbar": true
                    });
                    container.appendChild(script);
                }
            }
        }, [step, selectedPair, selectedTimeframe, tab]);

        useEffect(() => {
            let timer;
            if (step === 4 && secondsLeft > 0 && tab === 'sinais') {
                timer = setInterval(() => setSecondsLeft(prev => prev - 1), 1000);
            } else if (secondsLeft === 0 && step === 4 && tab === 'sinais') {
                setSecondsLeft(selectedTimeframe === '1' ? 60 : 300);
            }
            return () => clearInterval(timer);
        }, [step, secondsLeft, selectedTimeframe, tab]);

        const formatTime = (totalSeconds) => {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `0${mins}:${secs < 10 ? '0' : ''}${secs}`;
        };

        // Motor de Análise com Confluência Avançada (IA Simulation)
        const processSignal = (tf) => {
            setSelectedTimeframe(tf);
            setSecondsLeft(tf === '1' ? 60 : 300);
            setStep(3); // Tela de carregamento "Gotovim vash signal[span_1](start_span)"[span_1](end_span)

            setTimeout(() => {
                // Simulação de cálculo baseado em hash do par + tempo para consistência técnica
                const seed = selectedPair.name.length + parseInt(tf);
                const isBuy = (seed % 2 === 0); 
                
                setSignalData({
                    type: isBuy ? 'BUY' : 'SELL',
                    text: isBuy ? 'COMPRAR (CALL)' : 'VENDER (PUT)',
                    actionText: isBuy ? 'BUY' : 'SELL',
                    color: isBuy ? 'bg-emerald-600' : 'bg-rose-600',
                    textColor: isBuy ? 'text-emerald-400' : 'text-rose-400',
                    accuracy: '98.5%'
                });
                setStep(4); // Tela de resultado final
            }, 2200);
        };

        const updateScore = (period, type, delta) => {
            setStats(prev => ({
                ...prev,
                [period]: {
                    ...prev[period],
                    [type]: Math.max(0, prev[period][type] + delta)
                }
            }));
        };

        const calcRate = (w, l) => {
            const total = w + l;
            if (total === 0) return "0%";
            return ((w / total) * 100).toFixed(0) + "%";
        };

        return (
            <div className="bg-[#0b0f17] rounded-2xl border border-slate-800 shadow-2xl overflow-hidden w-full max-w-md min-h-[720px] flex flex-col justify-between relative">
                
                {/* Header */}
                <div className="bg-[#121824] p-3 flex justify-between items-center border-b border-slate-800">
                    <div className="flex items-center space-x-2">
                        <div className="w-5 h-5 bg-emerald-500 rounded flex items-center justify-center font-bold text-black text-xs">▲</div>
                        <span className="font-extrabold text-base text-white tracking-wider">PROFITOLOGY</span>
                    </div>
                    <div className="flex items-center space-x-2">
                        <span className="bg-slate-800 text-xs text-emerald-400 px-2.5 py-1 rounded-lg font-bold border border-slate-700 flex items-center gap-1">
                            {selectedBroker.icon} {selectedBroker.name}
                        </span>
                        <span className="bg-slate-800 text-xs text-slate-300 px-2 py-0.5 rounded font-semibold border border-slate-700">🇷🇺 RU</span>
                    </div>
                </div>

                {/* Conteúdo */}
                <div className="p-3 flex-1 overflow-y-auto">

                    {/* DASHBOARD */}
                    {tab === 'dashboard' && (
                        <div className="space-y-4">
                            <div>
                                <h2 className="text-lg font-extrabold text-white">Dashboard Geral de Performance</h2>
                                <p className="text-xs text-slate-400">Controle de Win e Loss por linha do tempo.</p>
                            </div>

                            <div className="bg-[#141b2d] p-4 rounded-xl border border-slate-800 space-y-3">
                                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Resultado de Hoje</span>
                                <div className="grid grid-cols-3 gap-2 text-center">
                                    <div className="bg-emerald-950/40 border border-emerald-500/30 p-2.5 rounded-xl">
                                        <span className="text-[10px] text-emerald-400 font-bold block">WINS</span>
                                        <span className="text-xl font-extrabold text-emerald-400">{stats.day.wins}</span>
                                    </div>
                                    <div className="bg-rose-950/40 border border-rose-500/30 p-2.5 rounded-xl">
                                        <span className="text-[10px] text-rose-400 font-bold block">LOSSES</span>
                                        <span className="text-xl font-extrabold text-rose-400">{stats.day.losses}</span>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-2.5 rounded-xl">
                                        <span className="text-[10px] text-cyan-400 font-bold block">ACERTO</span>
                                        <span className="text-xl font-extrabold text-cyan-400">{calcRate(stats.day.wins, stats.day.losses)}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-[#141b2d] p-3.5 rounded-xl border border-slate-800 space-y-3">
                                <span className="text-xs font-bold text-slate-300 block border-b border-slate-800 pb-2">Gerenciar Placar Manualmente</span>
                                {['day', 'week', 'month'].map((period) => (
                                    <div key={period} className="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
                                        <div>
                                            <span className="text-xs font-bold text-white capitalize">{period === 'day' ? 'Hoje' : period === 'week' ? 'Semana' : 'Mês'}</span>
                                            <span className="text-[10px] text-slate-400 block">{stats[period].wins}W • {stats[period].losses}L</span>
                                        </div>
                                        <div className="flex space-x-1">
                                            <button onClick={() => updateScore(period, 'wins', 1)} className="bg-emerald-600 px-2 py-1 rounded text-xs font-bold text-white">+ Win</button>
                                            <button onClick={() => updateScore(period, 'wins', -1)} className="bg-slate-800 px-2 py-1 rounded text-xs text-slate-400">-</button>
                                            <button onClick={() => updateScore(period, 'losses', 1)} className="bg-rose-600 px-2 py-1 rounded text-xs font-bold text-white">+ Loss</button>
                                            <button onClick={() => updateScore(period, 'losses', -1)} className="bg-slate-800 px-2 py-1 rounded text-xs text-slate-400">-</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* ABA SINAIS */}
                    {tab === 'sinais' && (
                        <div>
                            {/* PASSO 0: Mercado */}
                            {step === 0 && (
                                <div className="space-y-3">
                                    <h2 className="text-base font-extrabold text-white">Выбор рынка (Escolher Mercado)</h2>
                                    <div className="grid grid-cols-2 gap-2.5">
                                        <div onClick={() => { setSelectedMarketType('OTC'); setStep(1); }} className="bg-[#182030] p-4 rounded-xl border border-slate-700 cursor-pointer hover:border-emerald-500 transition-all">
                                            <span className="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded font-bold">Доступно</span>
                                            <h3 className="font-bold text-sm text-white mt-2">OTC</h3>
                                            <p className="text-[10px] text-slate-400 mt-0.5">Pares OTC para sessões de balcão.</p>
                                        </div>
                                        <div onClick={() => { setSelectedMarketType('CRYPTO'); setStep(1); }} className="bg-[#182030] p-4 rounded-xl border border-slate-700 cursor-pointer hover:border-emerald-500 transition-all">
                                            <span className="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded font-bold">24/7</span>
                                            <h3 className="font-bold text-sm text-white mt-2">Крипта</h3>
                                            <p className="text-[10px] text-slate-400 mt-0.5">Criptomoedas com payout atual.</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* PASSO 1: Ativos[span_2](start_span)[span_2](end_span) */}
                            {step === 1 && (
                                <div className="space-y-2">
                                    <div className="flex justify-between items-center mb-1">
                                        <h2 className="text-base font-extrabold text-white">Выбор валютной пары</h2>
                                        <button onClick={() => setStep(0)} className="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">Назад</button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 max-h-[320px] overflow-y-auto">
                                        {(MARKETS[selectedMarketType] || []).map((p, i) => (
                                            <div key={i} onClick={() => { setSelectedPair(p); setStep(2); }} className="bg-[#182030] p-3 rounded-xl border border-slate-800 hover:border-emerald-500 cursor-pointer flex justify-between items-center">
                                                <span className="text-xs font-bold text-white">{p.name}</span>
                                                <span className="bg-emerald-500/20 text-emerald-400 text-[10px] font-extrabold px-1.5 py-0.5 rounded-full">{p.payout}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* PASSO 2: Tempo[span_3](start_span)[span_3](end_span) */}
                            {step === 2 && (
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center mb-1">
                                        <div>
                                            <span className="text-[10px] text-emerald-400 font-bold uppercase">{selectedPair.name}</span>
                                            <h2 className="text-base font-extrabold text-white">Время экспирации</h2>
                                        </div>
                                        <button onClick={() => setStep(1)} className="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">Назад</button>
                                    </div>
                                    <p className="text-xs text-slate-400">Выберите, на сколько минут анализировать рынок для этого сигнала.</p>
                                    
                                    <div className="grid grid-cols-2 gap-2.5 pt-1">
                                        {[
                                            { label: '1 мин', val: '1' },
                                            { label: '3 мин', val: '3' },
                                            { label: '5 мин', val: '5' },
                                            { label: '15 мин', val: '15' }
                                        ].map((tf, i) => (
                                            <button key={i} onClick={() => processSignal(tf.val)} className="bg-[#182030] hover:border-emerald-500 p-4 rounded-xl border border-slate-700 text-center cursor-pointer transition-all">
                                                <span className="text-lg font-extrabold text-white block">{tf.label}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* PASSO 3: Carregamento[span_4](start_span)[span_4](end_span) */}
                            {step === 3 && (
                                <div className="flex flex-col items-center justify-center py-20 text-center space-y-3">
                                    <div className="w-16 h-16 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin flex items-center justify-center">
                                        <span className="text-xs">📊</span>
                                    </div>
                                    <h2 className="text-base font-extrabold text-white">Готовим ваш сигнал</h2>
                                    <p className="text-xs text-slate-400 max-w-[240px]">Получаем рыночные данные и проверяем выбранную настройку.</p>
                                </div>
                            )}

                            {/* PASSO 4: Resultado */}
                            {step === 4 && signalData && (
                                <div className="space-y-2.5">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs text-slate-300 font-bold">{selectedPair?.name} • {selectedTimeframe} MIN</span>
                                        <button onClick={() => setStep(0)} className="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded text-slate-300">Novo Sinal</button>
                                    </div>
                                    
                                    <div className="rounded-xl overflow-hidden border border-slate-800 bg-[#121824] h-[170px]">
                                        <div id="tradingview_widget_container" className="w-full h-full"></div>
                                    </div>

                                    <div className={`p-4 rounded-2xl border border-slate-700 text-center ${signalData.color} bg-opacity-20 relative overflow-hidden`}>
                                        <span className="text-[10px] text-slate-300 uppercase font-bold tracking-widest block">Ваш сигнал (Seu Sinal)</span>
                                        <h1 className={`text-2xl font-black tracking-wider my-1 ${signalData.textColor}`}>{signalData.actionText}</h1>
                                        <div className="flex justify-center items-center gap-1 text-xs text-slate-200">
                                            <span>Confluência de IA Ativa</span>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2 text-center">
                                        <div className="bg-[#141b2d] p-2 rounded-xl border border-slate-800">
                                            <span className="text-[9px] text-slate-400 block uppercase font-bold">Осталось (Tempo)</span>
                                            <span className="text-sm font-mono font-bold text-cyan-400">{formatTime(secondsLeft)}</span>
                                        </div>
                                        <div className="bg-[#141b2d] p-2 rounded-xl border border-slate-800">
                                            <span className="text-[9px] text-slate-400 block uppercase font-bold">Вероятность (Assertividade)</span>
                                            <span className="text-sm font-extrabold text-emerald-400">{signalData.accuracy}</span>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2 pt-1">
                                        <button onClick={() => alert("Ordem de Compra executada!")} className="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-2.5 rounded-xl text-xs shadow-lg">
                                            Comprar ▲
                                        </button>
                                        <button onClick={() => alert("Ordem de Venda executada!")} className="bg-rose-600 hover:bg-rose-500 text-white font-extrabold py-2.5 rounded-xl text-xs shadow-lg">
                                            Vender ▼
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* TREINAMENTO */}
                    {tab === 'treinamento' && (
                        <div className="space-y-3 text-xs">
                            <h2 className="text-lg font-extrabold text-white">📖 Manual de Operações</h2>
                            <div className="bg-[#182030] p-3 rounded-xl border border-slate-800 space-y-1">
                                <h3 className="font-bold text-emerald-400 text-sm">Motor Híbrido de IA</h3>
                                <p className="text-slate-300">O sistema agora valida a direção do ativo cruzando dados de momento e volatilidade durante a tela de carregamento.</p>
                            </div>
                        </div>
                    )}

                    {/* PERFIL */}
                    {tab === 'perfil' && (
                        <div className="space-y-3">
                            <h2 className="text-lg font-extrabold text-white">Perfil do Trader</h2>
                            <div className="bg-[#182030] p-3.5 rounded-xl border border-slate-800 text-xs space-y-2">
                                <div className="flex justify-between"><span className="text-slate-400">Status:</span><span className="text-emerald-400 font-bold">VIP PRO</span></div>
                                <div className="flex justify-between"><span className="text-slate-400">Corretora:</span><span className="text-white font-bold">{selectedBroker.name}</span></div>
                            </div>
                        </div>
                    )}
                </div>

                {/* NAVEGAÇÃO INFERIOR */}
                <div className="bg-[#121824] border-t border-slate-800 p-2 grid grid-cols-4 gap-1 text-center">
                    <button onClick={() => setTab('dashboard')} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 ${tab === 'dashboard' ? 'bg-slate-800 text-emerald-400 border border-slate-700' : 'text-slate-500'}`}>
                        <span>📊</span>
                        <span className="text-[10px]">Dashboard</span>
                    </button>
                    <button onClick={() => { setTab('sinais'); setStep(0); }} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 ${tab === 'sinais' ? 'bg-emerald-500 text-black font-extrabold glow-green' : 'text-slate-500'}`}>
                        <span>📈</span>
                        <span className="text-[10px]">Sinais</span>
                    </button>
                    <button onClick={() => setTab('treinamento')} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 ${tab === 'treinamento' ? 'bg-slate-800 text-white border border-slate-700' : 'text-slate-500'}`}>
                        <span>📖</span>
                        <span className="text-[10px]">Treino</span>
                    </button>
                    <button onClick={() => setTab('perfil')} className={`py-2 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-0.5 ${tab === 'perfil' ? 'bg-slate-800 text-white border border-slate-700' : 'text-slate-500'}`}>
                        <span>👤</span>
                        <span className="text-[10px]">Perfil</span>
                    </button>
                </div>

            </div>
        );
    }
    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
