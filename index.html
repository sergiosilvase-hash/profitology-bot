<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profitology Bot - Trading Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [isRunning, setIsRunning] = React.useState(false);
            const [balance, setBalance] = React.useState(1000.00);
            const [profit, setProfit] = React.useState(0.00);
            const [logs, setLogs] = React.useState([
                { time: new Date().toLocaleTimeString(), text: "Sistema inicializado com sucesso.", type: "info" }
            ]);

            const toggleBot = () => {
                setIsRunning(!isRunning);
                const time = new Date().toLocaleTimeString();
                if (!isRunning) {
                    setLogs(prev => [{ time, text: "Bot iniciado. A aguardar sinais de mercado...", type: "success" }, ...prev]);
                } else {
                    setLogs(prev => [{ time, text: "Bot parado pelo utilizador.", type: "warn" }, ...prev]);
                }
            };

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-6 min-h-screen flex flex-col justify-between">
                    {/* Header */}
                    <header className="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-6 shadow-lg">
                        <div>
                            <h1 className="text-xl md:text-2xl font-bold text-emerald-400">Profitology Bot</h1>
                            <p className="text-xs text-slate-400">Painel de Trading Automatizado</p>
                        </div>
                        <div className="text-right">
                            <span className="text-xs text-slate-500 block">Balanço Conta</span>
                            <span className="text-lg md:text-xl font-mono font-bold text-cyan-400">${balance.toFixed(2)}</span>
                        </div>
                    </header>

                    {/* Main Content / Dashboard */}
                    <main className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                        {/* Control Panel */}
                        <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between shadow-lg">
                            <div>
                                <h2 className="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-4">Controlo do Bot</h2>
                                <div className="space-y-4 mb-6">
                                    <div className="flex justify-between items-center text-sm">
                                        <span className="text-slate-400">Estado:</span>
                                        <span className={`px-2 py-1 rounded text-xs font-bold ${isRunning ? 'bg-emerald-950 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-400'}`}>
                                            {isRunning ? 'EM EXECUÇÃO' : 'PARADO'}
                                        </span>
                                    </div>
                                    <div className="flex justify-between items-center text-sm">
                                        <span className="text-slate-400">Lucro Atual:</span>
                                        <span className={`font-mono font-bold ${profit >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                            ${profit.toFixed(2)}
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <button 
                                onClick={toggleBot}
                                className={`w-full py-3 rounded-xl font-bold transition-all shadow-lg ${
                                    isRunning 
                                        ? 'bg-red-600 hover:bg-red-500 text-white shadow-red-900/40' 
                                        : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/40'
                                }`}
                            >
                                {isRunning ? 'Parar Bot' : 'Iniciar Bot'}
                            </button>
                        </div>

                        {/* Logs / Terminal */}
                        <div className="md:col-span-2 bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg flex flex-col">
                            <h2 className="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-4">Registo de Atividades</h2>
                            <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 h-48 overflow-y-auto font-mono text-xs space-y-2 flex-1">
                                {logs.map((log, index) => (
                                    <div key={index} className="flex space-x-2">
                                        <span className="text-slate-500">[{log.time}]</span>
                                        <span className={
                                            log.type === 'success' ? 'text-emerald-400' : 
                                            log.type === 'warn' ? 'text-amber-400' : 'text-slate-300'
                                        }>{log.text}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="text-center text-xs text-slate-500 py-2">
                        Profitology Bot &bull; Operacional na Vercel para Desktop e Telemóvel
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
